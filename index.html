<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadoras Laborales Ecuador</title>
</head>
<body>
  <h1>Calculadoras Laborales Ecuador</h1>
  <p>Calcula tu décimo tercero, décimo cuarto y liquidación en segundos.</p>

  <h2>Calculadora de décimo tercer sueldo</h2>

  <p>
    <label for="sueldo">Sueldo mensual (USD):</label><br>
    <input type="number" id="sueldo" placeholder="Ej: 600" min="0" step="0.01">
  </p>

  <p>
    <label for="meses">Meses trabajados (del 1 de diciembre al 30 de noviembre):</label><br>
    <input type="number" id="meses" value="12" min="1" max="12">
  </p>

  <button id="calcular">Calcular</button>

  <p id="resultado"></p>

  <script>
    const boton = document.getElementById("calcular");

    boton.addEventListener("click", function () {
      const sueldo = Number(document.getElementById("sueldo").value);
      const meses = Number(document.getElementById("meses").value);
      const resultado = document.getElementById("resultado");

      if (sueldo <= 0 || meses < 1 || meses > 12) {
        resultado.textContent = "Ingresa un sueldo mayor a 0 y entre 1 y 12 meses.";
        return;
      }

      const decimoTercero = (sueldo * meses) / 12;
      resultado.textContent = "Tu décimo tercer sueldo es: $" + decimoTercero.toFixed(2);
    });
  </script>
</body>
</html>
